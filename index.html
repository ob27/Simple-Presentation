<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon-black.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon-white.svg" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Presentation by Oestler</title>
    <!-- Curated named-font set for the Text/shape font pickers (ShapePropertiesPanel) —
         a small fixed upfront load, not lazy-loaded per selection; negligible
         cost at this size, cached across sessions once visited. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- crossorigin is required here, not just on the preconnect above —
         page-thumbnail generation (html-to-image, via exportPageAsImage)
         walks every stylesheet in the document trying to inline its CSS
         rules, and reading .cssRules off a cross-origin stylesheet fetched
         WITHOUT crossorigin throws a SecurityError. Google Fonts' CSS
         endpoint does send Access-Control-Allow-Origin, so fetching it in
         CORS mode (crossorigin="anonymous") is enough to make that readable
         instead of throwing on every single debounced thumbnail cycle —
         previously flooding the console until the accumulated error volume
         itself visibly slowed the tab down over a long editing session. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&family=Montserrat:wght@400;700&family=Playfair+Display:wght@400;700&family=Merriweather:wght@400;700&family=Caveat:wght@400;700&display=swap"
      rel="stylesheet" crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
